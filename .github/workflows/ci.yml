name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --python 3.11
      - name: Pruebas (sin red)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check src tests scripts

  privacy:
    name: Escaneo de privacidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # también revisa el historial completo
      - uses: astral-sh/setup-uv@v6
      - name: Datos personales y rastros de asistentes
        run: uv run --no-project python scripts/privacy_scan.py --history
